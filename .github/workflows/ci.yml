name: CI

on:
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Typecheck + Lint + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:run

